name: Test and build Packlift

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y appstream desktop-file-utils libadwaita-1-dev libarchive-tools libgtk-4-dev squashfs-tools zstd
      - name: Run tests and validate desktop integration
        run: |
          make test
          make install DESTDIR="$RUNNER_TEMP/flatapk-install"
          desktop-file-validate data/io.github.luis_gustavo_git_hub.Packlift.desktop
          appstreamcli validate --no-net data/io.github.luis_gustavo_git_hub.Packlift.metainfo.xml

  flatpak:
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Install Flatpak build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Build Flatpak bundle
        run: |
          flatpak-builder --user --install-deps-from=flathub --disable-rofiles-fuse \
            --repo=flatpak-repo --force-clean flatpak-build io.github.luis_gustavo_git_hub.Packlift.json
          flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            flatpak-repo Packlift-x86_64.flatpak io.github.luis_gustavo_git_hub.Packlift
      - name: Validate the installed bundle
        run: |
          flatpak install --user --noninteractive ./Packlift-x86_64.flatpak
          dbus-run-session -- flatpak run --command=sh io.github.luis_gustavo_git_hub.Packlift -ec '
            command -v flatpak-spawn
            if flatpak-spawn --host --watch-bus /usr/bin/true; then
              exit 1
            fi
          '
          flatpak override --user --talk-name=org.freedesktop.Flatpak io.github.luis_gustavo_git_hub.Packlift
          dbus-run-session -- flatpak run --command=sh io.github.luis_gustavo_git_hub.Packlift -ec '
            flatpak-spawn --host --watch-bus uname -m
            test -x /app/bin/packlift
            bsdtar --version
            msiinfo --version
            zstd --version
            unsquashfs -version | grep -F "unsquashfs version"
          '
      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: Packlift-x86_64
          path: Packlift-x86_64.flatpak
          if-no-files-found: error

  windows-games:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Rust integration tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak gcc-mingw-w64-x86-64
      - name: Add, launch and remove a game through the Rust installer
        run: |
          fixture="$(mktemp -d "$HOME/flatapk-wine-test.XXXXXX")"
          mkdir -p "$fixture/Game files/bin"
          touch "$fixture/Game files/bin/game-data"
          cat > "$fixture/game.c" <<'C'
          #include <stdio.h>
          int main(void) {
              FILE *data = fopen("game-data", "rb");
              if (!data) return 1;
              fclose(data);
              FILE *result = fopen("opened", "w");
              if (!result) return 2;
              return fclose(result);
          }
          C
          x86_64-w64-mingw32-gcc "$fixture/game.c" -o "$fixture/Game files/bin/Game.exe"
          dbus-run-session -- cargo run --locked --no-default-features --example wine_game_smoke -- "$fixture"

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [test, flatpak, windows-games]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: Packlift-x86_64
      - name: Publish the tested Flatpak
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          test "$GITHUB_REF_NAME" = "v$version"
          sha256sum Packlift-x86_64.flatpak > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" Packlift-x86_64.flatpak SHA256SUMS \
            --verify-tag --title "Packlift $version" --generate-notes --latest
