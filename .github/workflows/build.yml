name: Test and build Flatapk

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y appstream desktop-file-utils gettext libarchive-tools squashfs-tools zstd
      - name: Run tests and validate desktop integration
        run: |
          make test
          make install DESTDIR="$RUNNER_TEMP/flatapk-install"
          desktop-file-validate data/io.github.flatapk.Installer.desktop
          appstreamcli validate --no-net data/io.github.flatapk.Installer.metainfo.xml

  flatpak:
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Install Flatpak build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Build Flatpak bundle
        run: |
          flatpak-builder --user --install-deps-from=flathub --disable-rofiles-fuse \
            --repo=flatpak-repo --force-clean flatpak-build io.github.flatapk.Installer.json
          flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            flatpak-repo Flatapk-x86_64.flatpak io.github.flatapk.Installer
      - name: Validate the installed bundle
        run: |
          flatpak install --user --noninteractive ./Flatapk-x86_64.flatpak
          dbus-run-session -- flatpak run --command=sh io.github.flatapk.Installer -ec '
            flatpak-spawn --host --watch-bus uname -m
            test -x /app/bin/flatapk
            test -f /app/lib/flatapk-app/locale/pt_BR/LC_MESSAGES/flatapk.mo
            bsdtar --version
            msiinfo --version
            zstd --version
            unsquashfs -version | grep -F "unsquashfs version"
          '
          dbus-run-session -- flatpak run --command=python3 io.github.flatapk.Installer - <<'PY'
          import gi
          gi.require_version("Gtk", "4.0")
          gi.require_version("Adw", "1")
          from gi.repository import Adw, Gtk

          import sys
          import tempfile
          from pathlib import Path

          sys.path.insert(0, "/app/lib/flatapk-app")
          from flatapk.core import FlatapkError
          from flatapk.installer import Installer

          with tempfile.TemporaryDirectory() as scratch:
              root = Path(scratch)
              installer = Installer(data=root / "state", applications=root / "applications")
              app = {"exports": [{"argv": ["/bin/sh", "-c", "echo fixture-launch-error >&2; exit 1"]}]}
              try:
                  installer.observe_launch(app)
              except FlatapkError:
                  assert "fixture-launch-error" in installer.runner.log.read_text()
              else:
                  raise AssertionError("An unsuccessful host launch must be reported.")
          PY
      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: Flatapk-x86_64
          path: Flatapk-x86_64.flatpak
          if-no-files-found: error

  windows-games:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak gcc-mingw-w64-x86-64 libglib2.0-bin xvfb
      - name: Add, launch and remove an existing game using Wine from Flathub
        run: |
          fixture="$(mktemp -d "$HOME/flatapk-wine-test.XXXXXX")"
          mkdir -p "$fixture/Game files/bin"
          touch "$fixture/Game files/bin/game-data"
          cat > "$fixture/game.c" <<'C'
          #include <stdio.h>
          int main(void) {
              FILE *data = fopen("game-data", "rb");
              if (!data) return 1;
              fclose(data);
              FILE *result = fopen("opened", "w");
              if (!result) return 2;
              return fclose(result);
          }
          C
          x86_64-w64-mingw32-gcc "$fixture/game.c" -o "$fixture/Game files/bin/Game.exe"
          dbus-run-session -- xvfb-run -a python3 - "$fixture" <<'PY'
          import subprocess
          import sys
          import time
          from pathlib import Path
          from flatapk.installer import Installer
          from flatapk.wine import FLATPAK_WINE

          root = Path(sys.argv[1])
          installer = Installer(output=lambda line: print(line, flush=True),
                                data=root / "state", applications=root / "shortcuts")
          game = root / "Game files/bin/Game.exe"
          package, _ = installer.probe(game)
          app = installer.add_game(package, lambda step: print(step, flush=True), FLATPAK_WINE)
          assert app["runtime"] == FLATPAK_WINE
          shortcut = Path(app["exports"][0]["desktop"])
          result = game.with_name("opened")
          assert not result.exists(), "Registering a shortcut should not start the game."
          subprocess.run(["gio", "launch", str(shortcut)], check=True)
          for _ in range(120):
              if result.exists():
                  break
              time.sleep(1)
          assert result.exists(), "The menu shortcut did not start the game in its original folder."
          installer.uninstall(app, lambda step: None)
          assert not shortcut.exists()
          assert game.is_file() and game.with_name("game-data").is_file()
          PY
